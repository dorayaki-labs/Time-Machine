# Deploys the frontend to GitHub Pages on every push to main.
# Free for public repositories. Before the first run: Settings → Pages →
# Source → "GitHub Actions".
#
# SPA routing: GitHub Pages has no rewrite rules, so the workflow builds a
# 404.html that bounces unknown paths back to the app with the path in the
# query string; the snippet in index.html restores it. Deep links work.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Archive JSON edits (episodes, movies, characters, gadgets, indexes,
    # categories/languages) are committed straight to the repository by the
    # backend and fetched live by the site from raw.githubusercontent.com —
    # they do not change the built website, so they must NOT redeploy it.
    # A commit that mixes JSON with real website files still deploys:
    # paths-ignore only skips the run when EVERY changed file matches.
    paths-ignore:
      - 'public/archive/**'
      - 'public/data/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install and build
        env:
          # Public frontend values — set these as repository secrets
          # (Settings → Secrets and variables → Actions):
          #   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # The Pages site lives at /<repo>/ — match it so assets resolve.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run validate
          npm run build

      - name: Add SPA fallback (404 + path restore)
        run: node scripts/make-spa-fallback.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
