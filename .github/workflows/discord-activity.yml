# Discord notifications for CODE changes pushed to the repository.
#
# Scope: only notifications for application code, workflows, docs and config.
# Archive JSON (episodes, movies, characters, gadgets, indexes, data files)
# is committed straight to the repository by the backend and has its OWN
# notification pipeline (the notification_outbox → Discord webhook in the
# Edge Functions) — those pushes are excluded here at the trigger, so a
# batch of archive edits never produces a "code change" notification, and a
# commit that mixes archive JSON with real code still notifies (with the
# JSON files filtered out of the file list).
#
# Per-file statistics come from `git show --numstat` in a full checkout —
# real diff data, not guesses. Counting method (documented, no double
# counting): "modified" = min(additions, deletions) per file, because a
# modified line appears once as a deletion and once as an addition; pure
# insertions or pure deletions therefore never count as modified. Binary
# files (numstat shows "-") and files without a full diff are reported as
# such rather than inventing numbers.
#
# File lists are derived from git, NOT from the push-event payload: the
# payload's per-commit file arrays are capped and can arrive empty, which
# once made pure-code commits get skipped as "only touches JSON". The
# payload arrays are kept only as a fallback and are logged on every skip.
#
# The webhook URL is read from the DISCORD_WEBHOOK repository secret
# (Settings → Secrets and variables → Actions). If it is missing the run
# reports it loudly instead of silently sending nothing.

name: Discord GitHub Activity

on:
  push:
    branches: [main]
    paths-ignore:
      # Archive/data JSON is notified by the backend's own Discord pipeline.
      - 'public/archive/**'
      - 'public/data/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discord-activity
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out full history for exact file lists
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Send commit notifications
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');

          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

          const MAX_FILES_SHOWN = 8;

          // Per-file diff statistics from git numstat. Lines are
          // "added<TAB>deleted<TAB>path"; binary files show "-" for both
          // counters; renames look like "a<TAB>d<TAB>prefix/{old => new}/tail".
          function fileStats(commitId, commit) {
            try {
              const out = execFileSync('git',
                ['show', '--numstat', '--format=', commitId],
                { encoding: 'utf8', maxBuffer: 64 * 1024 * 1024 });
              const files = out.split('\n')
                .map((line) => line.trim())
                .filter(Boolean)
                .map((line) => {
                  const parts = line.split('\t');
                  if (parts.length < 3) return null;
                  const [a, d] = parts;
                  const displayPath = parts.slice(2).join('\t');
                  const renameMatch = displayPath.match(/^(.*)\{(.*) => (.*)\}(.*)$/);
                  return {
                    path: renameMatch
                      ? `${renameMatch[1]}${renameMatch[2] || renameMatch[3]}${renameMatch[4]}`
                      : displayPath,
                    renameLabel: renameMatch
                      ? `${renameMatch[1]}${renameMatch[2]}${renameMatch[4]} → ${renameMatch[1]}${renameMatch[3]}${renameMatch[4]}`
                      : null,
                    binary: a === '-' || d === '-',
                    added: a === '-' ? 0 : Number(a),
                    deleted: d === '-' ? 0 : Number(d),
                  };
                })
                .filter(Boolean);
              if (files.length) return { files, source: 'git' };
            } catch (error) { /* commit not in the checkout — fall back */ }
            const files = [
              ...(commit.added || []),
              ...(commit.modified || []),
              ...(commit.removed || []),
            ].map((path) => ({ path, binary: false, added: 0, deleted: 0 }));
            return { files, source: 'event payload' };
          }

          // One "📄 file" section with its real diff statistics.
          function fileSection(file) {
            const name = file.renameLabel
              ? `${file.path} ♻️ renamed from \`${file.renameLabel}\``
              : file.path;
            const head = `**📄 ${name}**`;
            if (file.binary) {
              return `${head}\n📦 Binary file — no line statistics available`;
            }
            const modified = Math.min(file.added, file.deleted);
            return `${head}\n- 🟢 Added: ${file.added} line${file.added === 1 ? '' : 's'}`
              + `\n- 🔴 Deleted: ${file.deleted} line${file.deleted === 1 ? '' : 's'}`
              + `\n- 🟠 Modified: ${modified} line${modified === 1 ? '' : 's'}`;
          }

          async function main() {
            const eventPath = process.env.GITHUB_EVENT_PATH;
            if (!eventPath) throw new Error('GITHUB_EVENT_PATH is missing');

            const event = JSON.parse(fs.readFileSync(eventPath, 'utf8'));

            // The repo convention is DISCORD_WEBHOOK; DISCORD_WEBHOOK_URL is
            // accepted as an alias because the Edge Functions use that name
            // and mixing the two up is the classic "workflow never fires" bug.
            const webhook = process.env.DISCORD_WEBHOOK || process.env.DISCORD_WEBHOOK_URL;
            if (!webhook) {
              console.error(
                '::error::No Discord webhook secret is set. Add DISCORD_WEBHOOK under '
                + 'Settings → Secrets and variables → Actions (a webhook URL from '
                + 'Server Settings → Integrations → Webhooks), then re-run.',
              );
              return; // do not fail pushes over a missing notification target
            }

            const commits = event.commits || [];
            if (!commits.length) {
              console.log('No commits in this push event — nothing to notify.');
              return;
            }

            for (const commit of commits) {
              const id7 = commit.id.slice(0, 7);
              const { files: changed, source } = fileStats(commit.id, commit);
              const payloadCounts = `payload arrays: +${(commit.added || []).length} `
                + `~${(commit.modified || []).length} -${(commit.removed || []).length}`;

              if (!changed.length) {
                console.log(`Commit ${id7} has no changed files (${source}; ${payloadCounts}) — skipped.`);
                continue;
              }

              // Defense in depth for mixed commits: archive JSON is excluded
              // here as well as at the trigger (the trigger path filter only
              // skips the workflow when EVERY file in the push is archive JSON).
              const codeFiles = changed.filter((f) => !/\.json$/i.test(f.path));
              const jsonCount = changed.length - codeFiles.length;

              if (!codeFiles.length) {
                console.log(
                  `Commit ${id7} only touches JSON `
                  + `(${jsonCount} file(s) from ${source}; ${payloadCounts}) — skipped.`,
                );
                continue;
              }
              console.log(
                `Commit ${id7}: ${codeFiles.length} code file(s) from ${source} `
                + `(${jsonCount} JSON file(s) excluded).`,
              );

              const totals = codeFiles.reduce(
                (acc, f) => ({ added: acc.added + (f.added || 0), deleted: acc.deleted + (f.deleted || 0) }),
                { added: 0, deleted: 0 },
              );
              const shown = codeFiles.slice(0, MAX_FILES_SHOWN);
              const description = [
                ...shown.map(fileSection),
                codeFiles.length > MAX_FILES_SHOWN
                  ? `*…and ${codeFiles.length - MAX_FILES_SHOWN} more file(s) `
                    + `(+${totals.added} −${totals.deleted} across all ${codeFiles.length} files)*`
                  : '',
              ].filter(Boolean).join('\n\n');

              const payload = {
                username: 'GitHub Activity',
                embeds: [{
                  title: `New code change pushed to ${process.env.GITHUB_REPOSITORY}`,
                  description: description.slice(0, 4000),
                  color: 5793266,
                  fields: [
                    { name: 'Author', value: commit.author?.name || 'Unknown', inline: true },
                    { name: 'Commit', value: `[\`${id7}\`](${commit.url})`, inline: true },
                    { name: 'Files changed', value: `${codeFiles.length} file(s) · +${totals.added} −${totals.deleted}`, inline: true },
                    { name: 'Message', value: (commit.message || 'No message').split('\n')[0].slice(0, 200) },
                  ],
                  footer: { text: `Branch: ${process.env.GITHUB_REF_NAME}` },
                  timestamp: new Date().toISOString(),
                }],
              };

              // Send with retry + backoff for Discord rate limits (429) and
              // transient 5xx; other failures fail the step so they are visible.
              let lastError = null;
              for (let attempt = 1; attempt <= 3; attempt += 1) {
                const res = await fetch(webhook, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify(payload),
                });
                if (res.ok) { lastError = null; break; }
                lastError = new Error(`Discord webhook responded ${res.status}`);
                const retryable = res.status === 429 || res.status >= 500;
                console.error(`Discord delivery attempt ${attempt} failed: ${res.status}`);
                if (!retryable || attempt === 3) break;
                const retryAfter = Number(res.headers.get('retry-after'));
                await sleep(Number.isFinite(retryAfter) && retryAfter > 0
                  ? Math.min(retryAfter * 1000, 10_000)
                  : attempt * 2000);
              }
              if (lastError) throw lastError;

              // Stay well inside the webhook rate limit (≈5 requests / 2 s).
              await sleep(700);
            }
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
