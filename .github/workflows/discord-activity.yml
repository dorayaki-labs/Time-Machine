# Discord notifications for CODE changes pushed to the repository.
#
# Scope: only notifications for application code, workflows, docs and config.
# Archive JSON (episodes, movies, characters, gadgets, indexes, data files)
# is committed straight to the repository by the backend and has its OWN
# notification pipeline (the notification_outbox → Discord webhook in the
# Edge Functions) — those pushes are excluded here at the trigger, so a
# batch of archive edits never produces a "code change" notification, and a
# commit that mixes archive JSON with real code still notifies (with the
# JSON files filtered out of the file list).
#
# File lists are derived from `git show --name-status` in a full checkout,
# NOT from the push-event payload: the payload's per-commit
# added/modified/removed arrays are capped and can arrive empty, which once
# made pure-code commits get skipped as "only touches JSON". The payload
# arrays are kept only as a fallback and are logged on every skip so a
# misclassification is always diagnosable from the run log.
#
# The webhook URL is read from the DISCORD_WEBHOOK repository secret
# (Settings → Secrets and variables → Actions). If it is missing the run
# reports it loudly instead of silently sending nothing.

name: Discord GitHub Activity

on:
  push:
    branches: [main]
    paths-ignore:
      # Archive/data JSON is notified by the backend's own Discord pipeline.
      - 'public/archive/**'
      - 'public/data/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discord-activity
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out full history for exact file lists
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Send commit notifications
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');

          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

          const STATUS_ICON = { A: '＋', M: '✎', D: '－' };

          // Changed files per commit. Authoritative source is git in the
          // checkout; the event payload's file arrays are only a fallback
          // for commits missing from it (e.g. force-pushed away), and
          // renames are decomposed so every entry is a plain CODE + path.
          function changedFiles(commit) {
            try {
              const out = execFileSync('git',
                ['show', '--name-status', '--format=', '--no-renames', commit.id],
                { encoding: 'utf8', maxBuffer: 64 * 1024 * 1024 });
              const files = out.split('\n')
                .map((line) => line.trim())
                .filter(Boolean)
                .map((line) => {
                  const tab = line.indexOf('\t');
                  return tab === -1 ? null : { code: line[0], file: line.slice(tab + 1) };
                })
                .filter(Boolean);
              if (files.length) return { files, source: 'git' };
            } catch (error) { /* commit not in the checkout — fall back */ }
            const files = [
              ...(commit.added || []).map((f) => ({ code: 'A', file: f })),
              ...(commit.modified || []).map((f) => ({ code: 'M', file: f })),
              ...(commit.removed || []).map((f) => ({ code: 'D', file: f })),
            ];
            return { files, source: 'event payload' };
          }

          async function main() {
            const eventPath = process.env.GITHUB_EVENT_PATH;
            if (!eventPath) throw new Error('GITHUB_EVENT_PATH is missing');

            const event = JSON.parse(fs.readFileSync(eventPath, 'utf8'));

            // The repo convention is DISCORD_WEBHOOK; DISCORD_WEBHOOK_URL is
            // accepted as an alias because the Edge Functions use that name
            // and mixing the two up is the classic "workflow never fires" bug.
            const webhook = process.env.DISCORD_WEBHOOK || process.env.DISCORD_WEBHOOK_URL;
            if (!webhook) {
              console.error(
                '::error::No Discord webhook secret is set. Add DISCORD_WEBHOOK under '
                + 'Settings → Secrets and variables → Actions (a webhook URL from '
                + 'Server Settings → Integrations → Webhooks), then re-run.',
              );
              return; // do not fail pushes over a missing notification target
            }

            const commits = event.commits || [];
            if (!commits.length) {
              console.log('No commits in this push event — nothing to notify.');
              return;
            }

            for (const commit of commits) {
              const id7 = commit.id.slice(0, 7);
              const { files: changed, source } = changedFiles(commit);
              const payloadCounts = `payload arrays: +${(commit.added || []).length} `
                + `~${(commit.modified || []).length} -${(commit.removed || []).length}`;

              if (!changed.length) {
                console.log(`Commit ${id7} has no changed files (${source}; ${payloadCounts}) — skipped.`);
                continue;
              }

              // Defense in depth for mixed commits: archive JSON is excluded
              // here as well as at the trigger (the trigger path filter only
              // skips the workflow when EVERY file in the push is archive JSON).
              const jsonCount = changed.filter((e) => /\.json$/i.test(e.file)).length;
              const files = changed
                .filter((e) => !/\.json$/i.test(e.file))
                .map((e) => `${STATUS_ICON[e.code] || '✎'} ${e.file}`);

              if (!files.length) {
                console.log(
                  `Commit ${id7} only touches JSON `
                  + `(${jsonCount} file(s) from ${source}; ${payloadCounts}) — skipped.`,
                );
                continue;
              }
              console.log(
                `Commit ${id7}: ${files.length} code file(s) from ${source} `
                + `(${jsonCount} JSON file(s) excluded).`,
              );

              const payload = {
                username: 'GitHub Activity',
                embeds: [{
                  title: `New code change pushed to ${process.env.GITHUB_REPOSITORY}`,
                  description: files.join('\n').slice(0, 3900),
                  color: 5793266,
                  fields: [
                    { name: 'Author', value: commit.author?.name || 'Unknown', inline: true },
                    { name: 'Commit', value: `[\`${id7}\`](${commit.url})`, inline: true },
                    { name: 'Message', value: (commit.message || 'No message').slice(0, 1000) },
                  ],
                  footer: { text: `Branch: ${process.env.GITHUB_REF_NAME}` },
                  timestamp: new Date().toISOString(),
                }],
              };

              // Send with retry + backoff for Discord rate limits (429) and
              // transient 5xx; other failures fail the step so they are visible.
              let lastError = null;
              for (let attempt = 1; attempt <= 3; attempt += 1) {
                const res = await fetch(webhook, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify(payload),
                });
                if (res.ok) { lastError = null; break; }
                lastError = new Error(`Discord webhook responded ${res.status}`);
                const retryable = res.status === 429 || res.status >= 500;
                console.error(`Discord delivery attempt ${attempt} failed: ${res.status}`);
                if (!retryable || attempt === 3) break;
                const retryAfter = Number(res.headers.get('retry-after'));
                await sleep(Number.isFinite(retryAfter) && retryAfter > 0
                  ? Math.min(retryAfter * 1000, 10_000)
                  : attempt * 2000);
              }
              if (lastError) throw lastError;

              // Stay well inside the webhook rate limit (≈5 requests / 2 s).
              await sleep(700);
            }
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
