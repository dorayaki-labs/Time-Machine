
name: Discord GitHub Activity

on:
  push:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send commit notifications
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          EVENT_PATH: ${{ github.event_path }}
        run: |
          node <<'NODE'
          const fs = require('fs');

          async function main() {
            const event = JSON.parse(
              fs.readFileSync(process.env.EVENT_PATH, 'utf8')
            );

            for (const commit of event.commits || []) {
              const files = [
                ...(commit.added || []).map(f => `＋ ${f}`),
                ...(commit.modified || []).map(f => `✎ ${f}`),
                ...(commit.removed || []).map(f => `－ ${f}`)
              ].filter(file => !/\.json$/i.test(file.replace(/^[＋✎－] /, '')));

              if (!files.length) continue;

              const description = files.join('\n').slice(0, 4000);

              const payload = {
                username: 'GitHub Activity',
                embeds: [{
                  title: 'New commit pushed',
                  description,
                  color: 5793266,
                  fields: [
                    {
                      name: 'Author',
                      value: commit.author?.name || 'Unknown',
                      inline: true
                    },
                    {
                      name: 'Commit',
                      value: `[\`${commit.id.slice(0, 7)}\`](${commit.url})`,
                      inline: true
                    },
                    {
                      name: 'Message',
                      value: (commit.message || 'No message').slice(0, 1000)
                    }
                  ],
                  footer: {
                    text: `Branch: ${process.env.GITHUB_REF_NAME}`
                  },
                  timestamp: new Date().toISOString()
                }]
              };

              const response = await fetch(
                process.env.DISCORD_WEBHOOK,
                {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify(payload)
                }
              );

              if (!response.ok) {
                throw new Error(`Discord error: ${response.status}`);
              }
            }
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
